<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Fix My Street Map</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div class="logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--primary)"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
            <span>Admin Dashboard</span>
        </div>
        <div style="display: flex; gap: 1rem;">
            <a href="/" class="btn-outline" style="text-decoration: none;">Back to Map</a>
            <button class="btn-outline" style="color: var(--danger); border-color: var(--danger); cursor: pointer;" onclick="logoutAdmin()">Logout</button>
        </div>
    </header>

    <main class="admin-main">
        <div class="container">
            <div class="admin-header">
                <h2>Manage Reported Issues</h2>
                <p class="text-muted">Update the status of citizen complaints directly from this dashboard.</p>
            </div>

            <!-- Dashboard Stats -->
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Total Issues</h3>
                    <p class="stat-number" id="stat-total">0</p>
                </div>
                <div class="stat-card">
                    <h3>New</h3>
                    <p class="stat-number text-danger" id="stat-new">0</p>
                </div>
                <div class="stat-card">
                    <h3>In Progress</h3>
                    <p class="stat-number text-warning" id="stat-progress">0</p>
                </div>
                <div class="stat-card">
                    <h3>Fixed</h3>
                    <p class="stat-number text-success" id="stat-fixed">0</p>
                </div>
            </div>
            
            <div class="table-container">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Location</th>
                            <th>Type</th>
                            <th>Description</th>
                            <th>Photo</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="issuesTableBody">
                        <!-- Rows populated by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="js/admin.js"></script>
</body>
</html>
