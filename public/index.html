<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fix My Street Map</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
    <header class="app-header">
        <div class="logo">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
            <h1>Fix My Street Map</h1>
        </div>
        <nav>
            <a href="/admin.html" class="btn-outline">Admin Dashboard</a>
        </nav>
    </header>

    <main>
    <!-- Map Container -->
    <div id="map"></div>

    <!-- Filter Panel Overlay -->
    <div class="filter-panel" id="filterPanel">
        <h4>Filter Issues</h4>
        <div class="filter-group">
            <label>Status</label>
            <select id="filterStatus" class="form-control" onchange="applyFilters()">
                <option value="All">All Statuses</option>
                <option value="New">New</option>
                <option value="In Progress">In Progress</option>
                <option value="Fixed">Fixed</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Category</label>
            <select id="filterType" class="form-control" onchange="applyFilters()">
                <option value="All">All Categories</option>
                <option value="Pothole">Pothole</option>
                <option value="Streetlight">Streetlight</option>
                <option value="Garbage">Garbage</option>
                <option value="Water Leak">Water Leak</option>
                <option value="Other">Other</option>
            </select>
        </div>
    </div>
    </main>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="js/app.js?v=2"></script>
</body>
</html>
